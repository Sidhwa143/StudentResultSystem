<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="search-box">

            <h1>Admin Login</h1>

            <input
                type="text"
                id="username"
                placeholder="Username"
            >

            <br><br>

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <br><br>

            <button onclick="login()">
                Login
            </button>

            <p id="message"></p>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
